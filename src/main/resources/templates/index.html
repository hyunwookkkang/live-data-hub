<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Data Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="pb-3 mb-4 border-bottom">
        <h1 class="fs-3 fw-bold text-dark">📡 Live Data Hub</h1>
        <p class="text-muted mb-0">실시간 라이브 방송 및 홈쇼핑 수집 데이터 (상위 10개)</p>
    </header>

    <!-- 방송 유형 전환 탭 -->
    <div class="mb-4">
        <div class="btn-group" role="group">
            <a th:href="@{/(type='live')}"
               class="btn"
               th:classappend="${currentType == 'live' ? 'btn-primary' : 'btn-outline-primary'}">
                라이브 방송
            </a>
            <a th:href="@{/(type='shopping')}"
               class="btn"
               th:classappend="${currentType == 'shopping' ? 'btn-primary' : 'btn-outline-primary'}">
                홈쇼핑
            </a>
        </div>
    </div>

    <!-- 데이터 테이블 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0 text-center">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" style="width: 30%;">방송정보(제목)</th>
                        <th scope="col">분류</th>
                        <th scope="col">방송시간</th>
                        <th scope="col">조회수/시청률</th>
                        <th scope="col">판매량</th>
                        <th scope="col">매출액</th>
                        <th scope="col">상품수</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 데이터가 없을 경우 -->
                    <tr th:if="${#lists.isEmpty(broadcastList)}">
                        <td colspan="7" class="py-4 text-muted">수집된 방송 데이터가 없습니다.</td>
                    </tr>
                    <!-- 데이터 리스트 순회 (Thymeleaf) -->
                    <tr th:each="item : ${broadcastList}">
                        <td class="text-start fw-semibold" th:text="${item.title}">방송 제목</td>
                        <td><span class="badge bg-secondary" th:text="${item.category}">분류</span></td>
                        <td th:text="${item.broadcastTime}">00:00</td>
                        <td th:text="${item.views}">0</td>
                        <td th:text="${item.salesCount}">0</td>
                        <td class="text-success fw-bold" th:text="${item.revenue}">0원</td>
                        <td th:text="${item.productCount}">0개</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
